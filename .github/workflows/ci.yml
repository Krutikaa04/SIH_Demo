name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests -q --cov=backend/app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - run: python scripts/ci_smoke.py
      - name: Download runtime wheelhouse
        run: python -m pip download -r requirements.txt -d vendor/wheels
      - name: Verify installation without an index
        run: |
          python -m venv /tmp/sih-offline
          /tmp/sih-offline/bin/python -m pip install --no-index --find-links vendor/wheels -r requirements.txt
          /tmp/sih-offline/bin/python -c "import fastapi, uvicorn, rapidfuzz, sklearn"

  ci:
    if: always()
    needs: [backend, frontend, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$SMOKE" = success
