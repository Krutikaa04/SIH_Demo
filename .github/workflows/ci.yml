name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests -q --cov=backend/app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
      - run: python scripts/ci_smoke.py
      - name: Download runtime wheelhouse
        run: python -m pip download -r requirements.txt -d vendor/wheels
      - name: Verify installation without an index
        run: |
          python -m venv /tmp/sih-offline
          /tmp/sih-offline/bin/python -m pip install --no-index --find-links vendor/wheels -r requirements.txt
          /tmp/sih-offline/bin/python -c "import fastapi, uvicorn, rapidfuzz, sklearn"

  bundle:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - run: Remove-Item frontend/dist -Recurse -Force
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Build and verify the Windows offline bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ./scripts/make_bundle.ps1
          $bundle = Join-Path $env:RUNNER_TEMP "sih-extracted"
          $offline = Join-Path $env:RUNNER_TEMP "sih-offline"
          Expand-Archive AICTE_ICMD_demo_bundle.zip -DestinationPath $bundle
          python -m venv $offline
          if ($LASTEXITCODE -ne 0) { throw "Creating offline environment failed" }
          $env:Path = "$offline\Scripts;$env:SystemRoot\System32;$env:SystemRoot"
          & "$offline\Scripts\python.exe" "$bundle\scripts\ci_smoke.py" --batch
          if ($LASTEXITCODE -ne 0) { throw "Offline Windows launcher smoke test failed" }

  ci:
    if: always()
    needs: [backend, frontend, smoke, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SMOKE: ${{ needs.smoke.result }}
          BUNDLE: ${{ needs.bundle.result }}
        run: |
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$SMOKE" = success
          test "$BUNDLE" = success
