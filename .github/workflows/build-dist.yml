name: Frontend build and offline release bundle

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/make_bundle.ps1"
      - "run.py"
      - "start_demo.bat"
      - ".github/workflows/build-dist.yml"
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  release-offline-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-frontend
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build offline demo bundle
        shell: pwsh
        run: ./scripts/make_bundle.ps1

      - name: Publish release bundle
        uses: softprops/action-gh-release@v2
        with:
          files: AICTE_ICMD_demo_bundle.zip
